name: Manual native-v2 migration control

on:
  workflow_dispatch:
  push:
    branches: [evaluation/manual-native-20261013]
    paths:
      - '.github/workflows/manual-native-control.yml'
      - 'evaluation/manual-native-control-20261013/**'

permissions:
  contents: read

concurrency:
  group: manual-native-control-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manual-control:
    if: >-
      github.repository == 'jsdhwfmax/branchshift-ai' &&
      github.ref == 'refs/heads/evaluation/manual-native-20261013' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out manual control without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up the fixed Python patch version without caching
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.15'
      - name: Validate one manually authored candidate or clean repeat
        run: |
          args=()
          if [ -d evaluation/manual-native-control-20261013/qualified-control ]; then
            args+=(--qualified-control evaluation/manual-native-control-20261013/qualified-control)
          fi
          python evaluation/manual-native-control-20261013/run_manual.py \
            --input evaluation/manual-native-control-20261013/candidate-input \
            --output "$RUNNER_TEMP/manual-native-control/evidence" "${args[@]}"
      - name: Retain bounded public evidence for one day
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manual-native-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/manual-native-control/manual-native-control.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
