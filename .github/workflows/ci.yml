name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install API dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e 'services/api[dev,contree]'

      - name: Install fixture dependencies
        run: |
          python -m venv fixtures/pydantic-v1-app/.venv
          fixtures/pydantic-v1-app/.venv/bin/python -m pip install -e 'fixtures/pydantic-v1-app[test]'

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the complete quality gate
        run: make check
