[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "branchshift-api"
version = "0.1.0"
description = "Evidence-first dependency migration orchestrator"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "openai>=1.100,<3",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.2,<2",
  "tavily-python>=0.7,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
contree = ["contree-sdk[httpx]==0.4.0.dev5"]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["nebius: requires live Nebius credentials"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
strict = true
